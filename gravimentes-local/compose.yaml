name: gravimentes

services:
  gravimentes:
    image: gravimentes:local
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${GRAVIMENTES_PUERTO:-8765}:8765"
    volumes:
      - type: bind
        source: ./conversor/datos
        target: /data
        bind:
          create_host_path: true
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
